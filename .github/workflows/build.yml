name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install optional MCP dependencies
        run: pip install -r requirements-optional.txt
        continue-on-error: true

      - name: Compile check (syntax)
        run: python -m compileall -q backend

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test server startup
        run: |
          python backend/app.py &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health; then ok=1; break; fi
            sleep 1
          done
          kill $SERVER_PID || true
          [ "$ok" = "1" ]

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p android :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-android-apk
          path: android/app/build/outputs/apk/release/*.apk
