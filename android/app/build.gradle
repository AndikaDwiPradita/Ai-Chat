plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.example.aichat"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.aichat"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Chaquopy membutuhkan ndk.abiFilters.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ---- Chaquopy: embed CPython + Flask backend di dalam APK (standalone) ----
chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install "Flask>=3.0"
            install "requests>=2.31"
            install "pypdf>=7.1.0"
            install "python-dotenv>=1.0"
            // MCP sengaja tidak dipasang di Android; app berjalan tanpa MCP.
        }
    }
    sourceSets {
        main {
            srcDir "src/main/python"
            srcDir "${rootDir}/../backend"
        }
    }
}
